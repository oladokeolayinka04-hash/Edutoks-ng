name: EduToks CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run offline security contract tests
        run: npm test
      - name: Build production bundle
        run: npm run build
